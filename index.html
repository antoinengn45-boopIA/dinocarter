<body>

  <div id="poki-logo-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 195" width="120" aria-label="Poki">

  <h1>DINO CHROME GAME</h1>
  <p class="subtitle">
    <kbd>ESPACE</kbd> / <kbd>↑</kbd> = Sauter &nbsp;|&nbsp;
    <kbd>↓</kbd> = S'accroupir &nbsp;|&nbsp;
    Toucher l'écran = Sauter
  </p>
  <p class="subtitle secret-hint">Double-<kbd>ESPACE</kbd> = activer le mode Pro ⚡</p>

  <div id="game-wrapper">
    <div id="score-board">
      <span id="pro-badge">⚡ DINO-PRO</span>
      <span class="label">HI</span>
      <span id="hi-score">00000</span>
      <span id="cur-score">00000</span>
    </div>
    <canvas id="c" width="600" height="150" role="img" aria-label="Zone de jeu Dino"></canvas>
    <div id="message" aria-live="polite">APPUYER SUR ESPACE POUR DÉMARRER</div>
  </div>

  <div id="hiscores">
    <div class="score-col">
      <h2>🏆 Top 5 du jour</h2>
      <ul id="daily-list"></ul>
    </div>
    <div class="score-col">
      <h2>👑 Top 5 All Time</h2>
      <ul id="alltime-list"></ul>
    </div>
  </div>
